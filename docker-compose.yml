# Somente o banco roda no Docker. A aplicação roda com `uv run redenb4` (ver README).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-redenb4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redenb4}
      POSTGRES_DB: ${POSTGRES_DB:-redenb4}
      TZ: UTC
    ports:
      - "${DB_PORTA:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
